<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Envio LocalStorage</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>

    <form onsubmit="event.preventDefault(); enviarDados();">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" required><br><br>

        <button type="button" onclick="enviarDados()">Enviar</button>
    </form>

    <script>
        function enviarDados() {
            let nome = document.getElementById("nome").value;
            let cidade = document.getElementById("cidade").value;

            if (nome && cidade) {
                localStorage.setItem("nome", nome);
                localStorage.setItem("cidade", cidade);

                // Redireciona para a página de exibição
                window.location.href = "exibicao_dados.html";
            }
        }
    </script>
</body>
</html>
