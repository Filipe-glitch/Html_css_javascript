<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo CSS Grid</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .box1 {
            grid-column: 1 / 4;
            background-color: blue;
            color: white;
            text-align: center;
            padding: 15px;
        }
        .box2 {
            background-color: blueviolet;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .box3 {
            background-color: brown;
            color: white;
            text-align: center;
            grid-column: 1 / 4;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Header</div>
        <div class="box2">Coluna 1</div>
        <div class="box2">Coluna 2</div>
        <div class="box2">Coluna 3</div>
        <div class="box3">Footer</div>
    </div>
</body>
</html>
