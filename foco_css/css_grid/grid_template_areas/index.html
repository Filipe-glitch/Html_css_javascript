<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid - Grid Template Areas</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 150px 1fr 150px;
            grid-template-rows: 60px 40px 200px 60px;
            grid-template-areas: 
                "topo topo topo"
                "menu menu menu"
                "esquerda principal direita"
                "rodape rodape rodape";
            gap: 8px;
        }

        .container > * {
            background: #eceff1;
            border: 1px solid #cfd8dc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .topo { grid-area: topo; background-color: #b0bec5; }
        .menu { grid-area: menu; background-color: #90a4ae; }
        .principal { grid-area: principal; background-color: #ffffff; }
        .esquerda { grid-area: esquerda; background-color: #e0e0e0; }
        .direita { grid-area: direita; background-color: #e0e0e0; }
        .rodape { grid-area: rodape; background-color: #78909c; color: white; }
    </style>
</head>
<body>
    <h1>Layout com <code>grid-template-areas</code></h1>
    <div class="container">
        <header class="topo">Topo</header>
        <nav class="menu">Menu</nav>
        <main class="principal">Conteúdo Principal</main>
        <aside class="esquerda">Aside Esquerdo</aside>
        <aside class="direita">Aside Direito</aside>
        <footer class="rodape">Rodapé</footer>
    </div>
</body>
</html>
