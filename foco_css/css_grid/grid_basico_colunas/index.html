<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid - Colunas e Linhas em PX</title>
    <style>
        .container {
            display: grid; 
            grid-template-columns: 100px 50px 80px 200px;
            grid-template-rows: 80px 100px 100px; 
            gap: 5px;
        }

        .box { 
            background: #e0e0e0; 
            border: 2px solid #000; 
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Grid Básico com Valores Fixos (px)</h1>
    <div class="container">
        <div class="box">1</div> 
        <div class="box">2</div> 
        <div class="box">3</div> 
        <div class="box">4</div> 
        <div class="box">5</div> 
        <div class="box">6</div> 
        <div class="box">7</div> 
        <div class="box">8</div> 
        <div class="box">9</div> 
    </div>
</body>
</html>
