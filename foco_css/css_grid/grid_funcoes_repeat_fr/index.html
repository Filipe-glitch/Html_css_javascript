<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid - Unidades FR e Repeat</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 2fr repeat(6, 1fr) 2fr;
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
            height: 80vh;
        }

        .box {
            background: #3f21ad;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Uso de <code>repeat()</code> e Unidade Fracionária (<code>fr</code>)</h1>
    <div class="container">
        <div class="box">1 (2fr)</div>
        <div class="box">2 (1fr)</div>
        <div class="box">3 (1fr)</div>
        <div class="box">4 (1fr)</div>
        <div class="box">5 (1fr)</div>
        <div class="box">6 (1fr)</div>
        <div class="box">7 (1fr)</div>
        <div class="box">8 (2fr)</div>
    </div>
</body>
</html>
