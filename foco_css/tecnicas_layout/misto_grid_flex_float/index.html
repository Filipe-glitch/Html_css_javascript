<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Faculdade - Misto</title>
    <style>
        body {
            background-image: url("teste.jpg");
            background-repeat: repeat-y;
            font-family: Arial, sans-serif;
        }

        img.flutuante {
            float: right;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .container > div {
            background-color: #ffffff;
            padding: 10px;
            border: 1px solid #ccc;
        }

        .container2 {
            display: flex;
            justify-content: center;  /* eixo horizontal */
            align-items: center;      /* eixo vertical */
            gap: 15px;
            background-color: #f0f0f0;
            padding: 20px;
        }

        .container2 > div {
            background-color: #3f21ad;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>teste</p>
    <p>nesse próximo teremos a imagem java</p>
    <p>
        <img class="flutuante" src="terti.svg" alt="Imagem Java" style="width: 170px; height: 170px; margin-left: 20px;"> 
        imagem exemplar
    </p>

    <h2>Estrutura com CSS Grid</h2>
    <div class="container">
        <div>Header</div>
        <div>Menu</div>
        <div>Conteúdo</div>
        <div>Footer</div>
    </div>

    <h2>Estrutura com Flexbox</h2>
    <div class="container2">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>
</body>
</html>
