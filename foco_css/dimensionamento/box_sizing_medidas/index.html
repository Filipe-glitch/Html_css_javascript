<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensionamento com Box Sizing</title>
    <style>
        .caixa-sem-padding {
            width: 400px; 
            height: 200px; 
            border: 2px solid red;
            box-sizing: border-box;
            background-color: #ffe6e6;
        }

        .caixa-com-padding {
            width: 400px; 
            height: 200px; 
            padding: 30px; 
            border: 2px solid blue;
            box-sizing: border-box;
            background-color: #e6f0ff;
        }
    </style>
</head>
<body>
    <h1>Uso da propriedade box-sizing: border-box</h1>
    <p>Com <code>border-box</code>, o padding e a borda não aumentam a largura total do elemento.</p>

    <div class="caixa-sem-padding">Largura total mantida em 400px (Sem padding)</div>
    <br>
    <div class="caixa-com-padding">Largura total mantida em 400px (Com 30px de padding interno)</div>
</body>
</html>
