<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento de Quadrados</title>
    <style>
        .square {
            border: 3px solid black;
            width: 85px;
            height: 60px;
            margin: 40px;
            background-color: floralwhite;
        }

        .square2 {
            position: absolute;
            right: 0px;
            top: 0px;
            background-color: brown;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .square3 {
            position: absolute;
            right: 0px;
            bottom: 0px;
            background-color: antiquewhite;
        }

        .square4 {
            position: absolute;
            left: 7px;
            bottom: 0px;
            background-color: black;
            color: blueviolet;
        }
    </style>
</head>
<body>
    <div class="square square1">square1</div>
    <div class="square square2">square2</div>
    <div class="square square3">square3</div>
    <div class="square square4">square4</div>
</body>
</html>
