<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition com Transform</title>
    <style> 
        .quadrado {
            width: 100px;
            height: 100px;
            background: rgb(8, 0, 255);
            transition: width 2s, height 2s, transform 2s;
        }
        
        .quadrado:hover {
            width: 300px;
            height: 300px;
            transform: rotate(360deg);
        }
    </style>
</head>
<body>
    <h1>Transição Combinada com Rotação</h1>
    <p>Passe o mouse sobre o quadrado:</p>
    <div class="quadrado"></div>
</body>
</html>
