<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transição Básica</title>
    <style> 
        .bloco {
            width: 100px;
            height: 100px;
            background: rgb(60, 0, 255);
            transition: width 2s;
        }
        
        .bloco:hover {
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Transição Simples</h1>
    <p>Passe o cursor sobre o quadrado:</p>
    <div class="bloco"></div>  
</body>
</html>
