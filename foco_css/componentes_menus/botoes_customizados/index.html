<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilização de Botões</title>
    <style>
        .button {
            background-color: gray;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <h2>Diferentes Elementos com Estilo de Botão</h2>

    <button>Botão Padrão sem CSS</button>
    <a href="#" class="button">Link como botão</a>
    <button class="button">Tag Button com Classe</button>
    <input type="button" class="button" value="Input Button">
</body>
</html>
