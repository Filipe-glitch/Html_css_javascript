<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários em HTML5</title>
</head>
<body>
    <h1>Estrutura de Formulários</h1>

    <form action="#" method="POST">
        <!-- Campo Texto -->
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" maxlength="40" required>
        </p>

        <!-- Seleção Única (Radio) -->
        <fieldset>
            <legend>Sua principal linguagem de programação</legend>
            <label><input type="radio" name="linguagem_pref" value="java"> Java</label><br>
            <label><input type="radio" name="linguagem_pref" value="javascript"> JavaScript</label><br>
            <label><input type="radio" name="linguagem_pref" value="csharp"> C#</label>
        </fieldset>

        <!-- Seleção Múltipla (Checkbox) -->
        <fieldset>
            <legend>Linguagens que você domina</legend>
            <label><input type="checkbox" name="linguagens[]" value="csharp"> C#</label>
            <label><input type="checkbox" name="linguagens[]" value="javascript"> JavaScript</label>
            <label><input type="checkbox" name="linguagens[]" value="python"> Python</label>
        </fieldset>

        <!-- Menu Dropdown (Select) -->
        <p>
            <label for="pais">País:</label>
            <select id="pais" name="pais">
                <option value="br">Brasil</option>
                <option value="jp">Japão</option>
                <option value="de">Alemanha</option>
            </select>
        </p>

        <!-- Área de Texto Extensa -->
        <p>
            <label for="mensagem">Sua mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="40" placeholder="Digite sua mensagem aqui..."></textarea>
        </p>

        <button type="submit">Enviar Formulário</button>
    </form>
</body>
</html>
